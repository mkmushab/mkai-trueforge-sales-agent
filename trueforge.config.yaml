# TrueForge Agent Harness Configuration — MK-AI Self-Improving Sales & Leads Agent
# Compatible with: npx @truefoundry/trueforge@latest (https://github.com/truefoundry/trueforge)
apiVersion: trueforge.dev/v1alpha1
kind: AgentHarnessConfig
metadata:
  name: mkai-self-improving-sales-agent
  version: "6.2.0"
  description: >
    Self-Improving B2B Sales & Lead Qualification Agent built on TrueForge.
    Uses all 4 TrueForge pillars: Skills (SKILL.md with autonomous self-rewriting),
    Subagents (4 parallel Sales specialists), MCP Server (mkai_mcp_server.py),
    and Sandbox-as-a-Tool (isolated battlecard & SHA-256 verification).

harness:
  mode: local # Scales from 'local' (SQLite on localhost:8790) to 'hosted' (Postgres + Redis)
  serverUrl: "http://localhost:8790"
  compaction:
    enabled: true
    tokenThreshold: 50000
  deferredToolLoading: true
  codeMode: true
  largeResultOffloading: true

models:
  defaultProvider: openai-compatible
  tiers:
    main:
      model: "${MK_MAIN_MODEL:-gpt-oss-120b}"
      baseUrl: "${MK_BASE_URL:-https://api.generalcompute.com/v1}"
      apiKeyEnv: "MK_MAIN_API_KEY"
      role: "Harvey <75w Cold Email Authoring & OpenOutreach Multi-Channel Sequences"
    heavy:
      model: "${MK_HEAVY_MODEL:-deepseek-v3.2}"
      baseUrl: "${MK_BASE_URL:-https://api.generalcompute.com/v1}"
      apiKeyEnv: "MK_HEAVY_API_KEY"
      role: "USA ($ USD) vs. India (₹ INR) PPP & 18% GST Math, Skill Self-Reflection & Rewriting"
    fast:
      model: "${MK_FAST_MODEL:-gemma-4-31B-it}"
      baseUrl: "${MK_BASE_URL:-https://api.generalcompute.com/v1}"
      apiKeyEnv: "MK_FAST_API_KEY"
      role: "Fast BANT/MEDDIC 0-100 Lead Scoring, Maps/Web Extraction & EspoCRM Sync"

# Pillar 1: Git-backed & Self-Modifiable Skills (SKILL.md)
skills:
  lazyLoadInSandbox: true
  signatureManifest: "SKILLs/skills_manifest.sig.json"
  packs:
    - id: mkai-sales-leads
      path: "SKILLs/mkai-sales-leads/SKILL.md"
      mirrorPath: "skills/mkai-sales-leads/SKILL.md"
      selfModifiable: true

# Pillar 2: Parallel Specialist Subagents with Isolated Context
subagents:
  enabled: true
  maxParallel: 4
  definitions:
    - id: subagent-2-1-ppp-pricing
      name: "USA vs. India Competitor Pricing & PPP Strategist"
      modelTier: heavy
      tools: ["sales_us_india_pricing_analysis", "mkai_calculate_gst_and_profit"]
    - id: subagent-2-4-bant-qualifier
      name: "AI-Sales-Agent BANT / MEDDIC 0-100 Lead Qualifier"
      modelTier: fast
      tools: ["sales_qualify_and_score_leads", "maps_leads_search", "web_agent_scrape_with_chrome_fallback"]
    - id: subagent-2-5-harvey-email
      name: "Harvey <75w Signal Cold Email & Anti-Fabrication Specialist"
      modelTier: main
      tools: ["harvey_stage_draft", "harvey_outbox", "gmail_connect_and_send"]
    - id: subagent-2-6-crm-outreach
      name: "EspoCRM Dual-Currency Deal Desk & OpenOutreach Cadence Agent"
      modelTier: fast
      tools: ["sales_espocrm_sync", "linkedin_connect_and_outreach"]

# Pillar 3: Model Context Protocol (MCP) Server Integration
mcpServers:
  - id: mkai-sales-orchestra-mcp
    transport: stdio
    command: "python3"
    args: ["mkai-backend/mkai_mcp_server.py"]
    deferredLoading: true
    humanApprovalCheckpoints:
      - tool: "workspace_send_email"
        policy: "ASK"
      - tool: "gmail_connect_and_send"
        policy: "ASK_WHEN_SEND_IMMEDIATELY"

# Pillar 4: Sandbox-as-a-Tool (On-Demand Isolated Execution)
sandbox:
  enabled: true
  provider: "daytona-or-local"
  provisionOnDemand: true
  workDir: "results/sandbox_artifacts"
  allowedOutputs: [".xlsx", ".pdf", ".csv", ".json", ".patch"]
