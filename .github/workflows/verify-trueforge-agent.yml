name: TrueForge Self-Improving Agent CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  verify-self-improving-agent:
    name: Run 1 -> Skill Rewrite -> Run 2 Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify MCP Server JSON-RPC 2.0 Handshake
        run: |
          python3 -c '
          import json, subprocess, sys
          req = json.dumps({"jsonrpc":"2.0","id":1,"method":"tools/list"}) + "
"
          p = subprocess.run([sys.executable, "mkai-backend/mkai_mcp_server.py"], input=req, capture_output=True, text=True, check=True)
          tools = json.loads(p.stdout.strip().splitlines()[-1])["result"]["tools"]
          print(f"Verified {len(tools)} MCP tools:", [t["name"] for t in tools])
          assert len(tools) >= 5
          '

      - name: Run Self-Improving Evaluation Loop (run.sh)
        run: |
          bash ./run.sh

      - name: Verify Scorecards & Skill Rewrite Diff Artifacts
        run: |
          python3 -c '
          import json, os
          for f in ["results/run_1_score.json", "results/run_2_score.json", "results/skill_diff_run1_to_run2.patch", "results/run_comparison.json"]:
              assert os.path.isfile(f) and os.path.getsize(f) > 0, f"Missing {f}"
          c = json.load(open("results/run_comparison.json"))
          print(f"Run 1 Score: {c["run_1"]["total_score"]} -> Run 2 Score: {c["run_2"]["total_score"]} (Delta: +{c["score_delta"]})")
          assert c["run_2"]["total_score"] > c["run_1"]["total_score"]
          '
